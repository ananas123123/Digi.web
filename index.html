  const list=Array.isArray(rs)?rs.slice():[];
  if(!list.some(r=>normalizeVersion(r.tag_name)===CURRENT_VERSION))
    list.unshift({tag_name:CURRENT_VERSION,name:"Digi 1.0.0.0",published_at:null,assets:[],prepared:true,releaseNotes:[
      "First stable Digi installer release",
      "Version 1.0.0.0 targets Windows and ships as a standalone NSIS installer",
      "Installer payload: 85.4 MB",
      "Release binary is hosted directly in Digi.web under versions/",
      "SHA-256: db895863de8931678f8414c1e386005c1df83bc4"
    ]});
  return list;
}

function download(){
  return Promise.resolve(layout('<section class="page"><div class="eyebrow">Download</div><h1>Digi installer</h1><p>Choose an installer option for Digi.</p><div class="download-option"><div class="download-option-copy"><h2 class="download-option-title">Digi installer</h2><div class="download-option-meta"><span>Version <strong>1.0.0.0</strong></span><span>Update <strong>1.0</strong></span><span>Windows</span></div></div><div class="download-action"><a class="download-expand" href="'+INSTALLER_URL+'" download="Digi-Installer-1.0.0.0.exe" aria-label="Download Digi"><span>'+Array.from("Download").map((ch,i)=>'<i class="letter" style="transition-delay:'+((i+1)*45)+'ms">'+ch+'</i>').join("")+'</span></a></div></div></section>'));
}

function releases(){
  return getReleases().then(rs=>{
    const list=withCurrentRelease(rs);
    const rows=list.length?list.map(r=>{
      const date=r.published_at?new Date(r.published_at).toLocaleDateString():"Released";
      const notes=r.releaseNotes&&r.releaseNotes.length?'<div class="release-notes"><div class="muted">Release data</div><ul>'+r.releaseNotes.map(n=>"<li>"+n+"</li>").join("")+'</ul></div>':"";
      const action=r.prepared?'<a class="button" href="#/download">Download</a>':'<a class="button" href="'+r.html_url+'" target="_blank" rel="noreferrer">GitHub</a>';
      return '<div class="row release-row"><div><strong>'+r.tag_name+'</strong><div class="muted">'+(r.name||"Release")+" · "+date+'</div>'+notes+'</div>'+action+'</div>';
    }).join(""):'<div class="notice">No releases published yet.</div>';
    return layout('<section class="page"><div class="eyebrow">Releases</div><h1>Release history</h1><p>Published releases from Digi GitHub.</p><div class="list">'+rows+"</div></section>");
  }).catch(()=>layout('<section class="page"><div class="eyebrow">Releases</div><h1>Release history</h1><p>Published releases from Digi GitHub.</p><div class="list"><div class="row release-row"><div><strong>1.0.0.0</strong><div class="muted">Digi 1.0.0.0 · Released</div><div class="release-notes"><div class="muted">Release data</div><ul><li>First stable Digi installer release</li><li>Version 1.0.0.0 targets Windows and ships as a standalone NSIS installer</li><li>Installer payload: 85.4 MB</li><li>Release binary is hosted directly in Digi.web under versions/</li><li>SHA-256: db895863de8931678f8414c1e386005c1df83bc4</li></ul></div></div><a class="button" href="#/download">Download</a></div></div></section>'));
}

function instructions(){
  return layout('<section class="page"><div class="eyebrow">Instructions</div><h1>Before installing</h1><p>How to use Digi</p><div class="grid"><article class="card"><h3>1. Download</h3><p>Download the latest published Digi installer from the Download page.</p></article><article class="card"><h3>2. Install</h3><p>Run the installer and follow the setup steps.</p></article><article class="card"><h3>3. Launch</h3><p>Open Digi and use it to quickly search for content on your Windows computer.</p></article><article class="card"><h3>4. Updates</h3><p>Return to the Releases page to check for newer versions.</p></article></div></section>');
}

function support(){
  return layout('<section class="page"><div class="eyebrow">Support</div><h1>Get support</h1><p>Need help with Digi? Report a problem or ask for help through GitHub.</p><div class="list"><a class="row" href="https://github.com/ananas123123/Digi-Factory-1.17.7.5/issues" target="_blank" rel="noreferrer"><span><strong>Get support</strong><br><small>Open GitHub Issues for help.</small></span><span>↗</span></a></div></section>');
}

function simplePage(title){
  return layout('<section class="page"><div class="eyebrow">Digi</div><h1>'+title+'</h1><p>Information for the current Digi release.</p></section>');
}

async function render(){
  const key=location.hash.slice(1)||"/";
  const app=document.getElementById("app");
  if(!app)return;
  try{
    let html;
    if(key==="/") html=home();
    else if(key==="/download") html=await download();
    else if(key==="/releases") html=await releases();
    else if(key==="/instructions") html=instructions();
    else if(key==="/support") html=support();
    else if(key==="/platform") html=simplePage("Windows");
    else if(key==="/release-info") html=simplePage("Latest release");
    else html=support();
    app.innerHTML=html;
    try{bindPage()}catch(e){console.error("Digi interaction error:",e)}
    window.scrollTo(0,0);
  }catch(e){
    console.error("Digi render error:",e);
    app.innerHTML=layout('<section class="page"><h1>Something went wrong</h1><p>The page could not be rendered.</p></section>');
  }
}

function bindPage(){
  bindFeedback();
  bindCoffee();
  bindDownload();
  bindHero();
  bindScrollReveal();
}

function bindFeedback(){
  if(document.getElementById("feedbackOverlay"))document.getElementById("feedbackOverlay").remove();
  const overlay=document.createElement("div");
  overlay.id="feedbackOverlay";
  overlay.className="feedback-overlay";
  overlay.innerHTML='<div class="feedback-modal-wrap"><div class="feedback-modal"><button class="feedback-close" type="button" aria-label="Close">×</button><h2 id="feedbackTitle">Report a bug</h2><p id="feedbackDescription">Tell us what went wrong so it can be investigated.</p><textarea class="feedback-input" id="feedbackInput" placeholder="Describe the problem..." maxlength="2000"></textarea><div class="feedback-actions"><button class="button" type="button" data-feedback-cancel>Cancel</button><button class="button primary" type="button" data-feedback-send>Send</button></div></div></div>';
  document.body.appendChild(overlay);
  document.querySelectorAll("[data-feedback-type]").forEach(el=>el.addEventListener("click",()=>openFeedback(el.dataset.feedbackType)));
  overlay.querySelector(".feedback-close").onclick=closeFeedback;
  overlay.querySelector("[data-feedback-cancel]").onclick=closeFeedback;
  overlay.addEventListener("click",e=>{if(e.target===overlay)closeFeedback()});
  overlay.querySelector("[data-feedback-send]").onclick=()=>{
    if(!overlay.querySelector("#feedbackInput").value.trim())return overlay.querySelector("#feedbackInput").focus();
    closeFeedback();
    const toast=document.createElement("div");
    toast.className="toast show";
    toast.innerHTML='<span class="toast-dot"></span><strong>Message sent</strong>';
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(),2600);
  };
  function openFeedback(type){
    overlay.querySelector("#feedbackTitle").textContent=type==="feature"?"Recommend a feature!":"Report a bug";
    overlay.querySelector("#feedbackDescription").textContent=type==="feature"?"Have an idea for making Digi better?":"Tell us what went wrong so it can be investigated.";
    overlay.querySelector("#feedbackInput").placeholder=type==="feature"?"Describe your feature idea...":"Describe the problem...";
    overlay.querySelector("#feedbackInput").value="";
    overlay.classList.add("open");
    document.body.style.overflow="hidden";
    setTimeout(()=>overlay.querySelector("#feedbackInput").focus(),80);
  }
  function closeFeedback(){overlay.classList.remove("open");document.body.style.overflow=""}
}

function bindCoffee(){
  const old=document.getElementById("coffeeOverlay");
  if(old)old.remove();
  const overlay=document.createElement("div");
  overlay.id="coffeeOverlay";
  overlay.className="coffee-overlay";
  overlay.innerHTML='<div class="coffee-modal-wrap"><div class="coffee-modal"><button class="coffee-close" type="button" aria-label="Close">×</button><div class="coffee-icon-large"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h11v5.5A4.5 4.5 0 0 1 11.5 18h-2A4.5 4.5 0 0 1 5 13.5V8Zm11 1h2a2 2 0 0 1 0 4h-2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><h2>Buy us a coffee</h2><p>If Digi is useful to you, you can support its development by buying us a coffee.</p><div class="coffee-actions"><button class="button" type="button" data-coffee-cancel>Maybe later</button><a class="button primary" href="https://www.buymeacoffee.com/" target="_blank" rel="noreferrer">Buy a coffee ↗</a></div></div></div>';
  document.body.appendChild(overlay);
  document.querySelector("[data-coffee-trigger]").onclick=()=>{overlay.classList.add("open");document.body.style.overflow="hidden"};
  overlay.querySelector(".coffee-close").onclick=close;
  overlay.querySelector("[data-coffee-cancel]").onclick=close;
  overlay.onclick=e=>{if(e.target===overlay)close()};
  function close(){overlay.classList.remove("open");document.body.style.overflow=""}
}

function bindDownload(){
  const button=document.querySelector(".download-expand:not(.disabled)");
  if(!button)return;
  const action=button.parentElement;
  const thanks=document.createElement("div");
  thanks.className="download-thanks";
  thanks.setAttribute("aria-live","polite");
  thanks.innerHTML=Array.from("Thank you for downloading Digi").map((ch,i)=>'<i class="thanks-letter" style="transition-delay:'+((i+1)*28)+'ms">'+(ch===" "?"&nbsp;":ch)+'</i>').join("")+'<span class="thanks-dot"></span>';
  action.appendChild(thanks);
  button.onclick=()=>{button.classList.add("clicked");setTimeout(()=>thanks.classList.add("show"),430)};
}

function bindHero(){
  const dot=document.querySelector(".hero-dot");
  if(dot){
    let x=0,y=0,drag=false,pid=null;
    const apply=()=>dot.style.transform="translate3d("+x+"px,"+y+"px,0)";
    dot.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();drag=true;pid=e.pointerId;dot.setPointerCapture(pid);dot.style.cursor="grabbing"};
    dot.onpointermove=e=>{if(drag&&e.pointerId===pid){x+=e.movementX;y+=e.movementY;apply()}};
    dot.onpointerup=e=>{if(e.pointerId!==pid)return;drag=false;dot.releasePointerCapture(pid);dot.style.cursor="grab";const sx=x,sy=y,start=performance.now();function back(t){const p=Math.min(1,(t-start)/420),q=1-Math.pow(1-p,4);x=sx*(1-q);y=sy*(1-q);apply();if(p<1)requestAnimationFrame(back)}requestAnimationFrame(back)};
  }
  const card=document.querySelector(".hero-card");
  if(card){
    card.onpointermove=e=>{const r=card.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;card.style.transform="perspective(900px) rotateX("+(-py*12)+"deg) rotateY("+(px*12)+"deg) scale(1.025)"};
    card.onpointerleave=()=>card.style.transform="";
  }
}

function bindScrollReveal(){
  const sections=document.querySelectorAll(".info-reveal,.feedback-reveal,.site-footer-reveal");
  if(!sections.length)return;
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("is-visible");
      }else{
        entry.target.classList.remove("is-visible");
      }
    });
  },{threshold:0,rootMargin:"-8% 0px -8% 0px"});
  sections.forEach(section=>observer.observe(section));
}

document.addEventListener("click",e=>{
  const route=e.target.closest("[data-route]");
  if(route){e.preventDefault();location.hash="#"+route.dataset.route}
});

window.addEventListener("hashchange",render);
window.addEventListener("scroll",()=>document.body.classList.toggle("has-scrolled",window.scrollY>18),{passive:true});
window.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    document.querySelectorAll(".feedback-overlay.open,.coffee-overlay.open").forEach(x=>x.classList.remove("open"));
    document.body.style.overflow="";
  }
});
render();
})();
</script>
</body>
</html>
