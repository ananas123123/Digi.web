<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11100b">
<meta name="description" content="Digi — Windows installer">
<title>Digi — Download</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f5f5f2;background:#11110f;--muted:#aaa99f;--line:#35342e;--panel:#191915;--gold:#c9a227;--gold-light:#e0bd45;--gold-dark:#8f7417}
*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(circle at 50% -10%,#393524 0,#171611 30%,#11110f 60%)}a,button{font:inherit}.shell{max-width:1000px;margin:auto;padding:24px}.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 0 42px}.brand{font-size:21px;font-weight:800;color:#fff;text-decoration:none;letter-spacing:-.03em}.brand:after{content:"";display:inline-block;width:6px;height:6px;margin:0 0 3px 5px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold),0 0 14px #c9a227aa,0 0 26px #c9a22766;animation:goldPulse 2.2s ease-in-out infinite}@keyframes goldPulse{0%,100%{box-shadow:0 0 5px var(--gold),0 0 12px #c9a22799,0 0 22px #c9a22755;opacity:.9}50%{box-shadow:0 0 8px var(--gold-light),0 0 20px #c9a227cc,0 0 34px #c9a22777;opacity:1}}.links{display:flex;gap:5px;flex-wrap:wrap}.links a{color:var(--muted);text-decoration:none;padding:9px 11px;border-radius:9px;font-size:14px;transition:.18s ease}.links a:hover,.links a.active{background:#25241e;color:#fff}.links a.active{box-shadow:inset 0 -1px var(--gold)}.hero{padding:70px 0 60px;max-width:720px}.eyebrow{color:var(--gold-light);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(48px,8vw,82px);line-height:.95;letter-spacing:-.06em;margin:16px 0}.hero-dot{display:inline-block;width:.115em;height:.115em;margin-left:.055em;border-radius:50%;vertical-align:middle;transform:translateY(-.035em);font-size:1em;line-height:0;color:transparent;background:var(--gold);box-shadow:0 0 7px var(--gold),0 0 18px #c9a227aa,0 0 30px #c9a22766;animation:heroGoldPulse 2.2s ease-in-out infinite}@keyframes heroGoldPulse{0%,100%{box-shadow:0 0 5px var(--gold),0 0 12px #c9a22799,0 0 22px #c9a22755;opacity:.9}50%{box-shadow:0 0 8px var(--gold-light),0 0 20px #c9a227cc,0 0 34px #c9a22777;opacity:1}}.hero p,.page>p{color:var(--muted);font-size:17px;line-height:1.7;max-width:650px}.actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;border:1px solid var(--line);border-radius:10px;background:#1d1c17;color:#fff;text-decoration:none;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease,color .18s ease}.button:hover{transform:translateY(-2px);background:#29271e;border-color:#5b5437;box-shadow:0 8px 24px #00000055}.button:active{transform:translateY(0) scale(.98);box-shadow:0 3px 10px #00000044}.primary{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}.primary:hover{background:var(--gold-light);border-color:var(--gold-light);box-shadow:0 10px 30px #c9a22738;color:#111}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:60px}.card{background:#171713e8;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 10px 35px #00000018}.card h2,.card h3{margin:0 0 8px}.card p{margin:0;color:var(--muted);line-height:1.6}.stat{font-size:28px;font-weight:750;margin:8px 0}.page{padding:35px 0 70px}.page h1{font-size:44px;letter-spacing:-.045em;margin:0 0 10px}.list{display:grid;gap:10px;margin-top:24px}.row{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:11px;color:inherit;text-decoration:none;transition:.18s ease}.row:hover{border-color:#5b5437;transform:translateY(-1px)}.muted,small{color:var(--muted)}.notice{padding:16px;border:1px solid #4b4328;background:#211f16;border-radius:10px;color:#c8c5b8;line-height:1.55;margin:18px 0}.hash{display:flex;gap:8px;align-items:center}.hash code{flex:1;word-break:break-all;font-family:ui-monospace,monospace}.footer{border-top:1px solid var(--line);padding:24px 0 10px;color:var(--muted);font-size:13px}.fade{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:700px){.grid{grid-template-columns:1fr}.nav{flex-direction:column;align-items:flex-start;gap:15px}.hero{padding-top:35px}.row{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const API="https://api.github.com/repos/ananas123123/Digi-Factory-1.17.7.5/releases";
let cache=null;
const pages={"/":"Home","/download":"Download","/releases":"Releases","/requirements":"Requirements","/verify":"Verify","/help":"Help"};
function nav(){const current=location.hash.slice(1)||"/";return '<header class="nav"><a class="brand" href="#/">Digi</a><nav class="links">'+Object.keys(pages).map(p=>'<a class="'+(current===p?"active":"")+'" href="#'+p+'">'+pages[p]+"</a>").join("")+"</nav></header>";}
function layout(content){return '<div class="shell">'+nav()+'<main class="fade">'+content+'</main><footer class="footer">Digi installer website · simple by design</footer></div>';}
function home(){return layout('<section class="hero"><div class="eyebrow">Digi for Windows</div><h1>Get Digi<span class="hero-dot">.</span><br>Nothing else.</h1><p>A focused website for downloading Digi, checking releases, and verifying what you install.</p><div class="actions"><a class="button primary" href="#/download">Download Digi</a><a class="button" href="#/releases">View releases</a></div></section><section class="grid"><article class="card"><h3>Latest release</h3><div id="version" class="stat">Checking…</div><p id="date">Checking GitHub releases.</p></article><article class="card"><h3>Platform</h3><div class="stat">Windows</div><p>Digi is distributed as a Windows desktop application.</p></article></section>');}
function getReleases(){if(cache)return Promise.resolve(cache);return fetch(API).then(r=>{if(!r.ok)throw Error("GitHub unavailable");return r.json();}).then(x=>(cache=x,x));}
function download(){return getReleases().then(rs=>{var r=rs[0],a=r&&r.assets&&r.assets.find(x=>/\.exe$/i.test(x.name));return layout('<section class="page"><div class="eyebrow">Download</div><h1>Digi installer</h1><p>Latest published release information is read directly from GitHub.</p>'+(r?'<div class="card"><h2>'+r.tag_name+'</h2><p>'+(r.name||"Latest release")+" · "+new Date(r.published_at).toLocaleDateString()+'</p><div class="actions">'+(a?'<a class="button primary" href="'+a.browser_download_url+'">Download '+a.name+'</a>':'<span class="button">No .exe asset published</span>')+"</div></div>":'<div class="notice">No published Digi release is currently available.</div>')+"</section>");}).catch(()=>layout('<section class="page"><div class="eyebrow">Download</div><h1>Digi installer</h1><p>The page is working, but GitHub could not be reached.</p><div class="notice">No published installer could be detected right now.</div></section>'));}
function releases(){return getReleases().then(rs=>{var rows=rs.length?rs.map(r=>'<div class="row"><div><strong>'+r.tag_name+'</strong><div class="muted">'+(r.name||"Release")+" · "+new Date(r.published_at).toLocaleDateString()+'</div></div><a class="button" href="'+r.html_url+'" target="_blank" rel="noreferrer">GitHub</a></div>').join(""):'<div class="notice">No releases published yet.</div>';return layout('<section class="page"><div class="eyebrow">Releases</div><h1>Release history</h1><p>Published releases from Digi GitHub.</p><div class="list">'+rows+"</div></section>");}).catch(()=>layout('<section class="page"><div class="eyebrow">Releases</div><h1>Release history</h1><p>GitHub could not be reached right now.</p><div class="notice">No release data is available.</div></section>'));}
function requirements(){return layout('<section class="page"><div class="eyebrow">Requirements</div><h1>Before installing</h1><p>Basic requirements for the first version of Digi.</p><div class="grid"><article class="card"><h3>Operating system</h3><p>Windows desktop.</p></article><article class="card"><h3>Architecture</h3><p>Use the architecture stated by the published installer.</p></article><article class="card"><h3>Disk space</h3><p>Leave enough space for the installer and application.</p></article><article class="card"><h3>Dependencies</h3><p>Any fixed runtime requirements will be documented here.</p></article></div></section>');}
function verify(){return getReleases().then(rs=>{var r=rs[0],a=r&&r.assets&&r.assets.find(x=>/\.exe$/i.test(x.name));return layout('<section class="page"><div class="eyebrow">Verification</div><h1>Verify the installer</h1><p>Published SHA-256 information will appear here when available.</p>'+(a?'<div class="card"><h3>'+a.name+'</h3><div class="hash"><code>'+(a.digest||"No digest published")+'</code>'+(a.digest?'<button class="button" id="copy">Copy</button>':"")+"</div></div>":'<div class="notice">No installer asset with a published digest is available yet.</div>')+"</section>");}).catch(()=>layout('<section class="page"><div class="eyebrow">Verification</div><h1>Verify the installer</h1><div class="notice">GitHub could not be reached right now.</div></section>'));}
function help(){return layout('<section class="page"><div class="eyebrow">Help</div><h1>Need help?</h1><p>Useful links for the first version.</p><div class="list"><a class="row" href="https://github.com/ananas123123/Digi-Factory-1.17.7.5" target="_blank" rel="noreferrer"><span><strong>Source repository</strong><br><small>View Digi source and documentation</small></span><span>↗</span></a><a class="row" href="https://github.com/ananas123123/Digi-Factory-1.17.7.5/issues" target="_blank" rel="noreferrer"><span><strong>Report a problem</strong><br><small>Open an issue on GitHub</small></span><span>↗</span></a></div></section>');}
function render(){var key=location.hash.slice(1)||"/";var result=key==="/" ? Promise.resolve(home()) : key==="/download"?download():key==="/releases"?releases():key==="/requirements"?Promise.resolve(requirements()):key==="/verify"?verify():Promise.resolve(help());result.then(html=>{document.getElementById("app").innerHTML=html;if(key==="/"){getReleases().then(rs=>{var r=rs[0];document.getElementById("version").textContent=r?r.tag_name:"Not published";document.getElementById("date").textContent=r?new Date(r.published_at).toLocaleDateString():"No GitHub release exists yet.";}).catch(()=>{document.getElementById("version").textContent="Unavailable";document.getElementById("date").textContent="Could not reach GitHub.";});}var copy=document.getElementById("copy");if(copy)copy.onclick=()=>{navigator.clipboard.writeText(document.querySelector(".hash code").textContent);copy.textContent="Copied";};});}
window.addEventListener("hashchange",render);render();
})();
</script>
</body>
</html>
