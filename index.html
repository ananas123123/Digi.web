function normalizeVersion(v){return String(v||"").replace(/^v/i,"")}

function withCurrentRelease(rs){
  const list=Array.isArray(rs)?rs.slice():[];
  const currentNotes=[
    "Latest stable Digi release",
    "Installer: Digi.Search.Engine.exe (249,486,929 bytes)",
    "SHA-256: 60931cbfab3af4a71a9548d904be25a781776079f50264a8859ae53ab3d2e03d"
  ];
  const currentIndex=list.findIndex(r=>normalizeVersion(r.tag_name)===CURRENT_VERSION);
  if(currentIndex<0){
    list.unshift({tag_name:"v1.1.0.0",name:"Digi 1.1.0.0",published_at:"2026-10-10T18:20:25Z",html_url:"https://github.com/ananas123123/digiwebversionreleases/releases/tag/v1.1.0.0",assets:[],prepared:true,releaseNotes:currentNotes});
  }else{
    list[currentIndex]={...list[currentIndex],name:list[currentIndex].name||"Digi 1.1.0.0",published_at:list[currentIndex].published_at||"2026-10-10T18:20:25Z",html_url:list[currentIndex].html_url||"https://github.com/ananas123123/digiwebversionreleases/releases/tag/v1.1.0.0",prepared:true,releaseNotes:list[currentIndex].releaseNotes&&list[currentIndex].releaseNotes.length?list[currentIndex].releaseNotes:currentNotes};
  }
  if(!list.some(r=>normalizeVersion(r.tag_name)==="1.0.0.0"))
    list.push({tag_name:"v1.0.0.0",name:"Digi 1.0.0.0",published_at:null,html_url:"https://github.com/ananas123123/digiwebversionreleases/releases/tag/v1.0.0.0",assets:[],releaseNotes:["Previous stable Digi release"]});
  return list.sort((a,b)=>normalizeVersion(a.tag_name)===CURRENT_VERSION?-1:(normalizeVersion(b.tag_name)===CURRENT_VERSION?1:0));
}

  try{

    else if(key==="/support") html=support();
    else if(key==="/platform") html=simplePage("Windows");
    else if(key==="/release-info") html=releaseInfo();

    app.innerHTML=html;
    try{bindPage()}catch(e){console.error("Digi interaction error:",e)}

    console.error("Digi render error:",e);

  function openFeedback(type){
    overlay.querySelector("#feedbackTitle").textContent=type==="feature"?"Recommend a feature!":"Report a bug";
    overlay.querySelector("#feedbackDescription").textContent=type==="feature"?"Have an idea for making Digi better?":"Tell us what went wrong so it can be investigated.";
    overlay.querySelector("#feedbackInput").placeholder=type==="feature"?"Describe your feature idea...":"Describe the problem...";
    overlay.querySelector("#feedbackInput").value="";
    overlay.classList.add("open");
    document.body.style.overflow="hidden";
    setTimeout(()=>overlay.querySelector("#feedbackInput").focus(),80);
  }
  function closeFeedback(){overlay.classList.remove("open");document.body.style.overflow=""}
}

function bindCoffee(){
  const old=document.getElementById("coffeeOverlay");
  if(old)old.remove();
  const overlay=document.createElement("div");
  overlay.id="coffeeOverlay";
  overlay.className="coffee-overlay";
  overlay.innerHTML='<div class="coffee-modal-wrap"><div class="coffee-modal"><button class="coffee-close" type="button" aria-label="Close"></button><div class="coffee-icon-large"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h11v5.5A4.5 4.5 0 0 1 11.5 18h-2A4.5 4.5 0 0 1 5 13.5V8Zm11 1h2a2 2 0 0 1 0 4h-2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><h2>Buy us a coffee</h2><p>If Digi is useful to you, you can support its development by buying us a coffee.</p><div class="coffee-actions"><button class="button" type="button" data-coffee-cancel>Maybe later</button><a class="button primary" href="https://buymeacoffee.com/ananas123123" target="_blank" rel="noreferrer">Buy a coffee ↗</a></div></div></div>';
  document.body.appendChild(overlay);
  document.querySelector("[data-coffee-trigger]").onclick=()=>{overlay.classList.add("open");document.body.style.overflow="hidden"};
  overlay.querySelector(".coffee-close").onclick=close;
  overlay.querySelector("[data-coffee-cancel]").onclick=close;
  overlay.onclick=e=>{if(e.target===overlay)close()};
  function close(){overlay.classList.remove("open");document.body.style.overflow=""}
}

function bindDownload(){
  const button=document.querySelector(".download-expand:not(.disabled)");
  if(!button)return;
  const action=button.parentElement;
  const thanks=document.createElement("div");
  thanks.className="download-thanks";
  thanks.setAttribute("aria-live","polite");
  thanks.innerHTML=Array.from("Thank you for downloading Digi").map((ch,i)=>'<i class="thanks-letter" style="transition-delay:'+((i+1)*28)+'ms">'+(ch===" "?"&nbsp;":ch)+'</i>').join("")+'<span class="thanks-dot"></span>';
  action.appendChild(thanks);
  button.onclick=()=>{button.classList.add("clicked");setTimeout(()=>thanks.classList.add("show"),430)};
}

function bindHero(){
  const dot=document.querySelector(".hero-dot");
  if(dot){
    let x=0,y=0,drag=false,pid=null;
    const apply=()=>dot.style.transform="translate3d("+x+"px,"+y+"px,0)";
    dot.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();drag=true;pid=e.pointerId;dot.setPointerCapture(pid);dot.style.cursor="grabbing"};
    dot.onpointermove=e=>{if(drag&&e.pointerId===pid){x+=e.movementX;y+=e.movementY;apply()}};
    dot.onpointerup=e=>{if(e.pointerId!==pid)return;drag=false;dot.releasePointerCapture(pid);dot.style.cursor="grab";const sx=x,sy=y,start=performance.now();function back(t){const p=Math.min(1,(t-start)/420),q=1-Math.pow(1-p,4);x=sx*(1-q);y=sy*(1-q);apply();if(p<1)requestAnimationFrame(back)}requestAnimationFrame(back)};
  }
  const card=document.querySelector(".hero-card");
  if(card){
    card.onpointermove=e=>{const r=card.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;card.style.transform="perspective(900px) rotateX("+(-py*12)+"deg) rotateY("+(px*12)+"deg) scale(1.025)"};
    card.onpointerleave=()=>card.style.transform="";
  }
}

function bindScrollReveal(){
  const sections=document.querySelectorAll(".digi-story,.info-reveal,.feedback-reveal,.site-footer-reveal");
  if(!sections.length)return;
  sections.forEach(section=>{
    section.classList.remove("is-visible");
    section.style.setProperty("--reveal-state","0");
  });
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("is-visible");
        entry.target.style.setProperty("--reveal-state","1");
      }else{
        entry.target.classList.remove("is-visible");
        entry.target.style.setProperty("--reveal-state","0");
      }
    });
  },{threshold:.08,rootMargin:"-10% 0px -10% 0px"});
  sections.forEach(section=>observer.observe(section));
}

document.addEventListener("click",e=>{
  const route=e.target.closest("[data-route]");
  if(route){e.preventDefault();location.hash="#"+route.dataset.route}
});

window.addEventListener("hashchange",render);
window.addEventListener("scroll",()=>document.body.classList.toggle("has-scrolled",window.scrollY>18),{passive:true});
window.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    document.querySelectorAll(".feedback-overlay.open,.coffee-overlay.open,.release-info-overlay.open").forEach(x=>x.classList.remove("open"));
    document.body.style.overflow="";
  }
});
render();
})();
</script>
