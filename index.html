<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f5f5f2;background:#11110f;--muted:#aaa99f;--line:#35342e;--panel:#191915;--gold:#c9a227;--gold-light:#e0bd45;--gold-dark:#8f7417}
*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(circle at 50% -10%,#393524 0,#171611 30%,#11110f 60%);background-size:140% 140%;animation:backgroundDrift 18s ease-in-out infinite alternate}a,button{font:inherit}.shell{max-width:1000px;margin:auto;padding:24px}.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 0 42px}.brand{font-size:21px;font-weight:800;color:#fff;text-decoration:none;letter-spacing:-.03em;text-shadow:0 0 10px #ffffff18,0 0 22px #c9a22718}.brand:after{content:"";display:inline-block;width:6px;height:6px;margin:0 0 3px 5px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold),0 0 14px #c9a227aa,0 0 26px #c9a22766;animation:goldPulse 2.2s ease-in-out infinite}@keyframes goldPulse{0%,100%{box-shadow:0 0 5px var(--gold),0 0 12px #c9a22799,0 0 22px #c9a22755;opacity:.9}50%{box-shadow:0 0 8px var(--gold-light),0 0 20px #c9a227cc,0 0 34px #c9a22777;opacity:1}}.links{display:flex;gap:5px;flex-wrap:wrap}.links a{color:var(--muted);text-decoration:none;padding:9px 11px;border-radius:9px;font-size:14px;transition:.18s ease}.links a:hover,.links a.active{background:#25241e;color:#fff}.links a.active{box-shadow:inset 0 -1px var(--gold)}.hero{padding:70px 0 60px;max-width:none;display:flex;align-items:center;justify-content:space-between;gap:70px}.hero-copy{max-width:720px;flex:1}.eyebrow{color:var(--gold-light);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(48px,8vw,82px);line-height:.95;letter-spacing:-.06em;margin:16px 0;text-shadow:0 0 8px #ffffff16,0 0 24px #ffffff0d,0 0 48px #c9a22712;animation:textGlow 3.5s ease-in-out infinite}.hero-dot{display:inline-block;width:.345em;height:.345em;margin-left:20px;border-radius:50%;vertical-align:middle;transform:translateY(-.035em);font-size:1em;line-height:0;color:transparent;background:var(--gold);box-shadow:0 0 8px var(--gold),0 0 18px var(--gold),0 0 38px #c9a227dd,0 0 65px #c9a22799,0 0 95px #c9a22755;animation:heroGoldPulse 2.2s ease-in-out infinite;cursor:grab;touch-action:none;user-select:none;z-index:3}@keyframes heroDotDrift{0%{transform:translate(-1px,-.035em) scale(1)}18%{transform:translate(7px,-5px) scale(1.04)}39%{transform:translate(-4px,6px) scale(.97)}61%{transform:translate(10px,2px) scale(1.03)}82%{transform:translate(2px,-7px) scale(1.02)}100%{transform:translate(-6px,3px) scale(1)}}@keyframes heroGoldPulse{0%,100%{box-shadow:0 0 8px var(--gold),0 0 18px var(--gold),0 0 38px #c9a227cc,0 0 65px #c9a22788,0 0 95px #c9a22744;opacity:.92}50%{box-shadow:0 0 10px var(--gold-light),0 0 24px var(--gold-light),0 0 48px #c9a227ff,0 0 80px #c9a227aa,0 0 115px #c9a22755;opacity:1}}.hero p,.page>p{color:var(--muted);font-size:17px;line-height:1.7;max-width:650px;text-shadow:0 0 12px #c9a22710}.actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;border:1px solid var(--line);border-radius:10px;background:#1d1c17;color:#fff;text-decoration:none;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease,color .18s ease}.button:hover{transform:translateY(-2px);background:#29271e;border-color:#5b5437;box-shadow:0 8px 24px #00000055}.button:active{transform:translateY(0) scale(.98);box-shadow:0 3px 10px #00000044}.primary{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}.primary:hover{background:var(--gold-light);border-color:var(--gold-light);box-shadow:0 10px 30px #c9a22738;color:#111}.hero-card{width:300px;height:250px;flex:0 0 300px;border-radius:10px;padding:1px;background:radial-gradient(circle 230px at 0% 0%,#f4d46a,#4a3908 38%,#17130a 72%);position:relative;transform-style:preserve-3d;will-change:transform;transition:transform .65s cubic-bezier(.22,1,.36,1),box-shadow .65s cubic-bezier(.22,1,.36,1);perspective:900px;cursor:pointer}.hero-card:hover{box-shadow:0 22px 55px #c9a22724,0 18px 45px #00000055}.hero-card .dot{width:5px;aspect-ratio:1;position:absolute;background:var(--gold-light);box-shadow:0 0 8px var(--gold-light),0 0 18px var(--gold);border-radius:100px;z-index:2;right:10%;top:10%;animation:moveDot 6s linear infinite}.hero-card .glow-ray{width:220px;height:45px;border-radius:100px;position:absolute;background:var(--gold-light);opacity:.28;box-shadow:0 0 50px var(--gold),0 0 90px #c9a22766;filter:blur(10px);transform-origin:10%;top:0;left:0;transform:rotate(40deg)}.hero-card .inner{z-index:1;width:100%;height:100%;border-radius:9px;border:1px solid #5b4918;background:radial-gradient(circle 280px at 0% 0%,#332a12,#0c0d0d);display:flex;align-items:center;justify-content:center;position:relative;flex-direction:column;color:#fff}.hero-card .big-number{font-weight:bolder;font-size:4rem;background:linear-gradient(45deg,#6d5310 4%,#ffe38a 45%,#b98d13 70%,#fff0ad);background-clip:text;color:transparent}.hero-card .card-line{width:100%;height:1px;position:absolute;background:#5c4915}.hero-card .top-line{top:10%;background:linear-gradient(90deg,#d9b73d 30%,#3a2e0c 70%)}.hero-card .bottom-line{bottom:10%}.hero-card .left-line{left:10%;width:1px;height:100%;background:linear-gradient(180deg,#d9b73d 30%,#33280a 70%)}.hero-card .right-line{right:10%;width:1px;height:100%;background:linear-gradient(180deg,#d9b73d 30%,#33280a 70%)}@keyframes moveDot{0%,100%{top:10%;right:10%}25%{top:10%;right:calc(100% - 35px)}50%{top:calc(100% - 30px);right:calc(100% - 35px)}75%{top:calc(100% - 30px);right:10%}}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:60px}.info-card{position:relative;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}.info-card:hover{transform:translateY(-6px);box-shadow:0 16px 38px #00000045;border-color:#5b5437}.info-button{position:absolute;top:14px;right:14px;width:25px;height:25px;border-radius:50%;border:1px solid #4b4637;background:#201f19;color:var(--gold-light);font-weight:800;cursor:pointer;transition:.18s ease}.info-button:hover{background:var(--gold);color:#111;box-shadow:0 0 15px #c9a22766}.card{background:#171713e8;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 10px 35px #00000018}.card h2,.card h3{margin:0 0 8px;text-shadow:0 0 12px #c9a22718}.card p{margin:0;color:var(--muted);line-height:1.6}.stat{font-size:28px;font-weight:750;margin:8px 0;text-shadow:0 0 14px #c9a22722}.page{padding:35px 0 70px}.page h1{font-size:44px;letter-spacing:-.045em;margin:0 0 10px}.list{display:grid;gap:10px;margin-top:24px}.row{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:11px;color:inherit;text-decoration:none;transition:.18s ease}.row:hover{border-color:#5b5437;transform:translateY(-1px)}.muted,small{color:var(--muted)}.notice{padding:16px;border:1px solid #4b4328;background:#211f16;border-radius:10px;color:#c8c5b8;line-height:1.55;margin:18px 0}.hash{display:flex;gap:8px;align-items:center}.hash code{flex:1;word-break:break-all;font-family:ui-monospace,monospace}.footer{border-top:1px solid var(--line);padding:24px 0 10px;color:var(--muted);font-size:13px}.fade{animation:pageEnter .8s cubic-bezier(.22,1,.36,1) both}.nav{animation:pageEnter .8s cubic-bezier(.22,1,.36,1) .05s both}.hero{animation:pageEnter .85s cubic-bezier(.22,1,.36,1) .14s both}.hero .eyebrow{animation:pageEnter .7s cubic-bezier(.22,1,.36,1) .22s both}.hero h1{animation:textGlow 3.5s ease-in-out infinite,pageEnter .9s cubic-bezier(.22,1,.36,1) .28s both}.hero p{animation:pageEnter .8s cubic-bezier(.22,1,.36,1) .38s both}.actions{animation:pageEnter .8s cubic-bezier(.22,1,.36,1) .46s both}.grid{animation:pageEnter .85s cubic-bezier(.22,1,.36,1) .54s both}.footer{animation:pageEnter .7s cubic-bezier(.22,1,.36,1) .64s both}@keyframes backgroundDrift{0%{background-position:0% 0%;}35%{background-position:75% 20%;}65%{background-position:30% 80%;}100%{background-position:100% 45%;}}@keyframes pageEnter{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:translateY(0)}}@keyframes textGlow{0%,100%{text-shadow:0 0 8px #ffffff16,0 0 24px #ffffff0d,0 0 48px #c9a22712}50%{text-shadow:0 0 10px #ffffff22,0 0 28px #ffffff12,0 0 58px #c9a2271c}}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:900px){.hero{flex-direction:column;align-items:flex-start}.hero-card{align-self:center}}@media(max-width:700px){.grid{grid-template-columns:1fr}.nav{flex-direction:column;align-items:flex-start;gap:15px}.hero{padding-top:35px}.row{flex-direction:column;align-items:flex-start}}

<body>
<div id="app"><div class="shell"><header class="nav"><a class="brand" href="#/">Digi</a><nav class="links"><a class="active" href="#/">Home</a><a href="#/download">Download</a><a href="#/releases">Releases</a><a href="#/instructions">Instructions</a><a href="#/support">Support</a></nav></header><main class="fade"><section class="hero"><div class="hero-copy"><h1>Get Digi<span class="hero-dot">.</span></h1><p>Digi is a focused Windows desktop search application designed to help you find what you need on your computer quickly and efficiently.</p><div class="actions"><a class="button primary" href="#/download">Download Digi</a><a class="button" href="#/releases">View releases</a></div></div><div class="hero-card"><div class="dot"></div><div class="inner"><div class="glow-ray"></div><div class="big-number">0</div><div>Installations</div><div class="card-line top-line"></div><div class="card-line left-line"></div><div class="card-line bottom-line"></div><div class="card-line right-line"></div></div></div></section></main><footer class="footer">Digi installer website · simple by design</footer></div></div>
<script>
(function(){
const API="https://api.github.com/repos/ananas123123/Digi-Factory-1.17.7.5/releases";
let cache=null;
const pages={"/":"Home","/download":"Download","/releases":"Releases","/instructions":"Instructions","/support":"Support"};
function nav(){const current=location.hash.slice(1)||"/";return '<header class="nav"><a class="brand" href="#/">Digi</a><nav class="links">'+Object.keys(pages).map(p=>'<a class="'+(current===p?"active":"")+'" href="#'+p+'">'+pages[p]+"</a>").join("")+"</nav></header>";}
function layout(content){return '<div class="shell">'+nav()+'<main class="fade">'+content+'</main><footer class="footer">Digi installer website · simple by design</footer></div>';}
function home(){return layout('<section class="hero"><div class="hero-copy"><h1>Get Digi<span class="hero-dot">.</span></h1><p>Digi is a focused Windows desktop search application designed to help you find what you need on your computer quickly and efficiently.</p><div class="actions"><a class="button primary" href="#/download">Download Digi</a><a class="button" href="#/releases">View releases</a></div></div><div class="hero-card"><div class="dot"></div><div class="inner"><div class="glow-ray"></div><div class="big-number">0</div><div>Installations</div><div class="card-line top-line"></div><div class="card-line left-line"></div><div class="card-line bottom-line"></div><div class="card-line right-line"></div></div></div></section><section class="grid"><article class="card info-card" onclick="location.hash=&quot;#/release-info&quot;" role="link" tabindex="0"><button class="info-button" aria-label="More information" onclick="event.stopPropagation();location.hash=&quot;#/release-info&quot;">i</button><h3>Latest release</h3><div id="version" class="stat">Checking…</div><p id="date">Checking GitHub releases.</p></article><article class="card info-card" onclick="location.hash=&quot;#/platform&quot;" role="link" tabindex="0"><button class="info-button" aria-label="More information" onclick="event.stopPropagation();location.hash=&quot;#/platform&quot;">i</button><h3>Platform</h3><div class="stat">Windows</div><p>Digi is distributed as a Windows desktop application.</p></article></section>');}
function getReleases(){if(cache)return Promise.resolve(cache);return fetch(API).then(r=>{if(!r.ok)throw Error("GitHub unavailable");return r.json();}).then(x=>(cache=x,x));}
function download(){return getReleases().then(rs=>{var r=rs[0],a=r&&r.assets&&r.assets.find(x=>/\.exe$/i.test(x.name));return layout('<section class="page"><div class="eyebrow">Download</div><h1>Digi installer</h1><p>Latest published release information is read directly from GitHub.</p>'+(r?'<div class="card"><h2>'+r.tag_name+'</h2><p>'+(r.name||"Latest release")+" · "+new Date(r.published_at).toLocaleDateString()+'</p><div class="actions">'+(a?'<a class="button primary" href="'+a.browser_download_url+'">Download '+a.name+'</a>':'<span class="button">No .exe asset published</span>')+"</div></div>":'<div class="notice">No published Digi release is currently available.</div>')+"</section>");}).catch(()=>layout('<section class="page"><div class="eyebrow">Download</div><h1>Digi installer</h1><p>The page is working, but GitHub could not be reached.</p><div class="notice">No published installer could be detected right now.</div></section>'));}
function releases(){return getReleases().then(rs=>{var rows=rs.length?rs.map(r=>'<div class="row"><div><strong>'+r.tag_name+'</strong><div class="muted">'+(r.name||"Release")+" · "+new Date(r.published_at).toLocaleDateString()+'</div></div><a class="button" href="'+r.html_url+'" target="_blank" rel="noreferrer">GitHub</a></div>').join(""):'<div class="notice">No releases published yet.</div>';return layout('<section class="page"><div class="eyebrow">Releases</div><h1>Release history</h1><p>Published releases from Digi GitHub.</p><div class="list">'+rows+"</div></section>");}).catch(()=>layout('<section class="page"><div class="eyebrow">Releases</div><h1>Release history</h1><p>GitHub could not be reached right now.</p><div class="notice">No release data is available.</div></section>'));}
function instructions(){return layout('<section class="page"><div class="eyebrow">Instructions</div><h1>Before installing</h1><p>How to use Digi</p><div class="grid"><article class="card"><h3>1. Download</h3><p>Download the latest published Digi installer from the Download page.</p></article><article class="card"><h3>2. Install</h3><p>Run the installer and follow the setup steps.</p></article><article class="card"><h3>3. Launch</h3><p>Open Digi and use it to quickly search for content on your Windows computer.</p></article><article class="card"><h3>4. Updates</h3><p>Return to the Releases page to check for newer versions.</p></article></div></section>');}
function verify(){return getReleases().then(rs=>{var r=rs[0],a=r&&r.assets&&r.assets.find(x=>/\.exe$/i.test(x.name));return layout('<section class="page"><div class="eyebrow">Verification</div><h1>Verify the installer</h1><p>Published SHA-256 information will appear here when available.</p>'+(a?'<div class="card"><h3>'+a.name+'</h3><div class="hash"><code>'+(a.digest||"No digest published")+'</code>'+(a.digest?'<button class="button" id="copy">Copy</button>':"")+"</div></div>":'<div class="notice">No installer asset with a published digest is available yet.</div>')+"</section>");}).catch(()=>layout('<section class="page"><div class="eyebrow">Verification</div><h1>Verify the installer</h1><div class="notice">GitHub could not be reached right now.</div></section>'));}
function support(){return layout('<section class="page"><div class="eyebrow">Support</div><h1>Support Digi</h1><p>If Digi is useful to you, you can support its development or get help through the links below.</p><div class="list"><a class="row" href="#" rel="noreferrer"><span><strong>Buy us a coffee</strong><br><small>Support the continued development of Digi</small></span><span>↗</span></a><a class="row" href="https://github.com/ananas123123/Digi-Factory-1.17.7.5/issues" target="_blank" rel="noreferrer"><span><strong>Get support</strong><br><small>Report a problem or ask for help on GitHub</small></span><span>↗</span></a></div></section>');}
function render(){var key=location.hash.slice(1)||"/";var result=key==="/" ? Promise.resolve(home()) : key==="/download"?download():key==="/releases"?releases():key==="/instructions"?Promise.resolve(instructions()):key==="/support"?Promise.resolve(support()):key==="/platform"?Promise.resolve(layout('<section class="page"></section>')):key==="/release-info"?Promise.resolve(layout('<section class="page"></section>')):Promise.resolve(support());result.then(html=>{document.getElementById("app").innerHTML=html;enableHeroDotDrag();enableCardTilt();if(key==="/"){getReleases().then(rs=>{var r=rs[0];document.getElementById("version").textContent=r?r.tag_name:"Not published";document.getElementById("date").textContent=r?new Date(r.published_at).toLocaleDateString():"No GitHub release exists yet.";}).catch(()=>{document.getElementById("version").textContent="Unavailable";document.getElementById("date").textContent="Could not reach GitHub.";});}var copy=document.getElementById("copy");if(copy)copy.onclick=()=>{navigator.clipboard.writeText(document.querySelector(".hash code").textContent);copy.textContent="Copied";};});}
function enableHeroDotDrag(){var dot=document.querySelector(".hero-dot");if(!dot)return;var x=0,y=0,anchorX=0,anchorY=0,dragging=false,pointerId=null,raf=0,startTime=performance.now();function apply(dx,dy){dot.style.transform="translate3d("+dx.toFixed(2)+"px,"+dy.toFixed(2)+"px,0)"}function spin(now){if(dragging)return;var t=(now-startTime)/1000;apply(anchorX+Math.cos(t*.85)*7,anchorY+Math.sin(t*1.1)*5);raf=requestAnimationFrame(spin)}function startSpin(){cancelAnimationFrame(raf);startTime=performance.now();raf=requestAnimationFrame(spin)}dot.addEventListener("pointerdown",function(e){if(e.button!==0)return;e.preventDefault();dragging=true;pointerId=e.pointerId;dot.style.cursor="grabbing";dot.setPointerCapture(e.pointerId);cancelAnimationFrame(raf);dot.style.transition="none"});dot.addEventListener("pointermove",function(e){if(!dragging||e.pointerId!==pointerId)return;x+=e.movementX;y+=e.movementY;apply(x,y)});function release(e){if(!dragging||e.pointerId!==pointerId)return;dragging=false;anchorX=x;anchorY=y;pointerId=null;dot.style.cursor="grab";if(dot.hasPointerCapture(e.pointerId))dot.releasePointerCapture(e.pointerId);startSpin()}dot.addEventListener("pointerup",release);dot.addEventListener("pointercancel",release);startSpin()};function enableCardTilt(){var card=document.querySelector(".hero-card");if(!card)return;var max=12,targetX=0,targetY=0,currentX=0,currentY=0,raf=0,baseRect=null,active=false;function frame(){currentX+=(targetX-currentX)*.12;currentY+=(targetY-currentY)*.12;card.style.transform="perspective(900px) rotateX("+currentX.toFixed(3)+"deg) rotateY("+currentY.toFixed(3)+"deg) scale(1.025)";if(Math.abs(targetX-currentX)>.01||Math.abs(targetY-currentY)>.01||active)raf=requestAnimationFrame(frame);else raf=0}function start(){if(!raf)raf=requestAnimationFrame(frame)}card.addEventListener("pointerenter",function(){baseRect=card.getBoundingClientRect();active=true;start()});card.addEventListener("pointermove",function(e){if(!baseRect)baseRect=card.getBoundingClientRect();var x=(e.clientX-baseRect.left)/baseRect.width,y=(e.clientY-baseRect.top)/baseRect.height;targetY=(x-.5)*max*2;targetX=(.5-y)*max*2;start()});card.addEventListener("pointerleave",function(){active=false;targetX=0;targetY=0;start()})};window.addEventListener("hashchange",render);render();
})();
</script>
