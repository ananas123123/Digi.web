<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b0f">
<meta name="description" content="Digi — Windows installer">
<title>Digi — Download</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f5f7fb;background:#101010;--muted:#a1a1a1;--line:#303030;--panel:#141414}
*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(circle at 50% -10%,#2a2a2a 0,#101010 42%)}a,button{font:inherit}.shell{max-width:1000px;margin:auto;padding:24px}.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 0 42px}.brand{font-size:21px;font-weight:700;color:#fff;text-decoration:none}.links{display:flex;gap:5px;flex-wrap:wrap}.links a{color:var(--muted);text-decoration:none;padding:9px 11px;border-radius:9px;font-size:14px}.links a:hover,.links a.active{background:#202020;color:#fff}.hero{padding:70px 0 60px;max-width:720px}.eyebrow{color:#b8b8b8;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.hero h1{font-size:clamp(48px,8vw,82px);line-height:.95;letter-spacing:-.06em;margin:16px 0}.hero p,.page>p{color:var(--muted);font-size:17px;line-height:1.7;max-width:650px}.actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;border:1px solid var(--line);border-radius:10px;background:#1a1a1a;color:#fff;text-decoration:none;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease}.button:hover{transform:translateY(-2px);background:#252525;border-color:#444;box-shadow:0 8px 24px rgba(0,0,0,.28)}.button:active{transform:translateY(0) scale(.98);box-shadow:0 3px 10px rgba(0,0,0,.2)}.primary{background:#fff;color:#111;border-color:#fff;font-weight:600}.primary:hover{background:#e6e6e6;border-color:#e6e6e6;box-shadow:0 10px 28px rgba(255,255,255,.08)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:60px}.card{background:rgba(13,18,25,.9);border:1px solid var(--line);border-radius:14px;padding:22px}.card h2,.card h3{margin:0 0 8px}.card p{margin:0;color:var(--muted);line-height:1.6}.stat{font-size:28px;font-weight:700;margin:8px 0}.page{padding:35px 0 70px}.page h1{font-size:44px;letter-spacing:-.045em;margin:0 0 10px}.list{display:grid;gap:10px;margin-top:24px}.row{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:11px}.muted,small{color:var(--muted)}.notice{padding:16px;border:1px solid #363636;background:#181818;border-radius:10px;color:#c0c0c0;line-height:1.55;margin:18px 0}.hash{display:flex;gap:8px;align-items:center}.hash code{flex:1;word-break:break-all;font-family:ui-monospace,monospace}.footer{border-top:1px solid var(--line);padding:24px 0 10px;color:var(--muted);font-size:13px}.fade{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:700px){.grid{grid-template-columns:1fr}.nav{flex-direction:column;align-items:flex-start;gap:15px}.hero{padding-top:35px}.row{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const API="https://api.github.com/repos/ananas123123/Digi-Factory-1.17.7.5/releases";
let cache=null;
const pages={"/":"Home","/download":"Download","/releases":"Releases","/requirements":"Requirements","/verify":"Verify","/help":"Help"};

function nav(){
 const current=location.hash.slice(1)||"/";
 return '<header class="nav"><a class="brand" href="#/">Digi</a><nav class="links">'+
 Object.keys(pages).map(function(p){return '<a class="'+(current===p?"active":"")+'" href="#'+p+'">'+pages[p]+'</a>';}).join("")+
 '</nav></header>';
}
function layout(content){return '<div class="shell">'+nav()+'<main class="fade">'+content+'</main><footer class="footer">Digi installer website · simple by design</footer></div>';}
function home(){
 return layout('<section class="hero"><div class="eyebrow">Digi for Windows</div><h1>Get Digi.<br>Nothing else.</h1><p>A focused website for downloading Digi, checking releases, and verifying what you install.</p><div class="actions"><a class="button primary" href="#/download">Download Digi</a><a class="button" href="#/releases">View releases</a></div></section><section class="grid"><article class="card"><h3>Latest release</h3><div id="version" class="stat">Checking…</div><p id="date">Checking GitHub releases.</p></article><article class="card"><h3>Platform</h3><div class="stat">Windows</div><p>Digi is distributed as a Windows desktop application.</p></article></section>');
}
function getReleases(){
 if(cache)return Promise.resolve(cache);
 return fetch(API).then(function(r){if(!r.ok)throw Error("GitHub unavailable");return r.json();}).then(function(x){cache=x;return x;});
}
function download(){
 return getReleases().then(function(rs){
  var r=rs[0], a=r&&r.assets&&r.assets.find(function(x){return /\.exe$/i.test(x.name);});
  return layout('<section class="page"><div class="eyebrow">Download</div><h1>Digi installer</h1><p>Latest published release information is read directly from GitHub.</p>'+
   (r?'<div class="card"><h2>'+r.tag_name+'</h2><p>'+(r.name||"Latest release")+' · '+new Date(r.published_at).toLocaleDateString()+'</p><div class="actions">'+(a?'<a class="button primary" href="'+a.browser_download_url+'">Download '+a.name+'</a>':'<span class="button">No .exe asset published</span>')+'</div></div>':'<div class="notice">No published Digi release is currently available.</div>')+'</section>');
 }).catch(function(){return layout('<section class="page"><div class="eyebrow">Download</div><h1>Digi installer</h1><p>The page is working, but GitHub could not be reached.</p><div class="notice">No published installer could be detected right now.</div></section>');});
}
function releases(){
 return getReleases().then(function(rs){
  var rows=rs.length?rs.map(function(r){return '<div class="row"><div><strong>'+r.tag_name+'</strong><div class="muted">'+(r.name||"Release")+' · '+new Date(r.published_at).toLocaleDateString()+'</div></div><a class="button" href="'+r.html_url+'" target="_blank" rel="noreferrer">GitHub</a></div>';}).join(""):'<div class="notice">No releases published yet.</div>';
  return layout('<section class="page"><div class="eyebrow">Releases</div><h1>Release history</h1><p>Published releases from Digi GitHub.</p><div class="list">'+rows+'</div></section>');
 }).catch(function(){return layout('<section class="page"><div class="eyebrow">Releases</div><h1>Release history</h1><p>GitHub could not be reached right now.</p><div class="notice">No release data is available.</div></section>');});
}
function requirements(){return layout('<section class="page"><div class="eyebrow">Requirements</div><h1>Before installing</h1><p>Basic requirements for the first version of Digi.</p><div class="grid"><article class="card"><h3>Operating system</h3><p>Windows desktop.</p></article><article class="card"><h3>Architecture</h3><p>Use the architecture stated by the published installer.</p></article><article class="card"><h3>Disk space</h3><p>Leave enough space for the installer and application.</p></article><article class="card"><h3>Dependencies</h3><p>Any fixed runtime requirements will be documented here.</p></article></div></section>');}
function verify(){
 return getReleases().then(function(rs){
  var r=rs[0],a=r&&r.assets&&r.assets.find(function(x){return /\.exe$/i.test(x.name);});
  return layout('<section class="page"><div class="eyebrow">Verification</div><h1>Verify the installer</h1><p>Published SHA-256 information will appear here when available.</p>'+
   (a?'<div class="card"><h3>'+a.name+'</h3><div class="hash"><code>'+(a.digest||"No digest published")+'</code>'+(a.digest?'<button class="button" id="copy">Copy</button>':"")+'</div></div>':'<div class="notice">No installer asset with a published digest is available yet.</div>')+'</section>');
 }).catch(function(){return layout('<section class="page"><div class="eyebrow">Verification</div><h1>Verify the installer</h1><div class="notice">GitHub could not be reached right now.</div></section>');});
}
function help(){return layout('<section class="page"><div class="eyebrow">Help</div><h1>Need help?</h1><p>Useful links for the first version.</p><div class="list"><a class="row" href="https://github.com/ananas123123/Digi-Factory-1.17.7.5" target="_blank" rel="noreferrer"><span><strong>Source repository</strong><br><small>View Digi source and documentation</small></span><span>↗</span></a><a class="row" href="https://github.com/ananas123123/Digi-Factory-1.17.7.5/issues" target="_blank" rel="noreferrer"><span><strong>Report a problem</strong><br><small>Open an issue on GitHub</small></span><span>↗</span></a></div></section>');}

function render(){
 var key=location.hash.slice(1)||"/";
 var result=key==="/" ? Promise.resolve(home()) : key==="/download"?download():key==="/releases"?releases():key==="/requirements"?Promise.resolve(requirements()):key==="/verify"?verify():Promise.resolve(help());
 result.then(function(html){
  document.getElementById("app").innerHTML=html;
  if(key==="/"){
   getReleases().then(function(rs){var r=rs[0];document.getElementById("version").textContent=r?r.tag_name:"Not published";document.getElementById("date").textContent=r?new Date(r.published_at).toLocaleDateString():"No GitHub release exists yet.";}).catch(function(){document.getElementById("version").textContent="Unavailable";document.getElementById("date").textContent="Could not reach GitHub.";});
  }
  var copy=document.getElementById("copy");
  if(copy)copy.onclick=function(){navigator.clipboard.writeText(document.querySelector(".hash code").textContent);copy.textContent="Copied";};
 });
}
window.addEventListener("hashchange",render);
render();
})();
</script>
</body>
</html>
